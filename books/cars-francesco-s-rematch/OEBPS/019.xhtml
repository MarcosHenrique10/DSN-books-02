    <p>
      <span class="font-10">
        <span id="w391">	They</span>
        <span id="w392">finally</span>
        <span id="w393">stopped</span>
        <span id="w394">to</span>
        <span id="w395">rest.</span>
        <span id="w396">Francesco</span>
        <span id="w397">sighed.</span>
        <br/>
        <span id="w398">&#8220;Ah,</span>
        <span id="w399">Italia</span>
        <span id="w400">is</span>
        <span id="w401">beautiful,</span>
        <span id="w402">no?</span>
        <span id="w403">Just</span>
        <span id="w404">like</span>
        <span id="w405">Francesco!&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-10">
        <span id="w406">	Lightning</span>
        <span id="w407">chuckled.</span>
        <span id="w408">&#8220;Do</span>
        <span id="w409">you</span>
        <span id="w410">always</span>
        <span id="w411">think</span>
        <span id="w412">about</span>
        <span id="w413">yourself?&#8221;</span>
        <span id="w414">he</span>
        <span id="w415">asked.</span>
      </span>
    </p>
    <p>
      <span class="font-10">
        <span id="w416">	&#8220;Of</span>
        <span id="w417">course.</span>
        <span id="w418">Francesco</span>
        <span id="w419">only</span>
        <span id="w420">thinks</span>
        <span id="w421">about</span>
        <span id="w422">doing</span>
        <span id="w423">his</span>
        <span id="w424">best.</span>
        <span id="w425">This</span>
        <span id="w426">is</span>
        <span id="w427">why</span>
        <span id="w428">he</span>
        <span id="w429">wins!&#8221;</span>
        <span id="w430">the</span>
        <span id="w431">Italian</span>
        <span id="w432">racer</span>
        <span id="w433">replied.</span>
      </span>
    </p>
